name: Build container image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: read
  packages: write

concurrency:
  group: codex-web-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Image published as \`${IMAGE}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Export portable image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull "${IMAGE}@${DIGEST}"
          docker tag "${IMAGE}@${DIGEST}" "${IMAGE}:sha-${GITHUB_SHA}"
          docker save "${IMAGE}:sha-${GITHUB_SHA}" | gzip -1 > "$RUNNER_TEMP/codex-web.tar.gz"
          cd "$RUNNER_TEMP"
          sha256sum codex-web.tar.gz > codex-web.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: codex-web-image-${{ github.sha }}
          path: |
            ${{ runner.temp }}/codex-web.tar.gz
            ${{ runner.temp }}/codex-web.tar.gz.sha256
          compression-level: 0
          retention-days: 7
